name: Publicar FATigaStore
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generar tienda y SEO
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            REPO_OWNER="${GITHUB_REPOSITORY%/*}"
            if [ "$REPO_NAME" = "$REPO_OWNER.github.io" ]; then
              export SITE_URL="https://${REPO_OWNER}.github.io"
            else
              export SITE_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}"
            fi
          fi
          python3 scripts/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
